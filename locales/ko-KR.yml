  allowExternalApRedirect: "ActivityPub 경유 조회에 리디렉션 허가"
  allowExternalApRedirect_description: "활성화하면 다른 서버가 이 서버를 통해 제3자의 콘텐츠를 조회할 수 있습니다만, 콘텐츠의 사칭 문제가 생길 수 있습니다."
