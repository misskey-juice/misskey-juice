_aboutJuice:
  _features:
    advancedNoteSearch: "Advanced search options for note search and reaction search (AND/OR, excluded words, has files, has CW, has replies, has poll, visibility)"
    aiGenerated: "AI-generated content flag for notes and attached files (federates over ActivityPub)"
    announcementPoll: "Polls in announcements"
    announcementReaction: "Multiple reactions on announcements"
    approvalSignup: "Approval-required signup (reason input, approval/rejection by moderators, a check code to track approval status even without collecting an email address)"
    avatarDecorationRequest: "Avatar decoration requests from regular users"
    remoteAvatarDecorations: "Show avatar decorations of remote users (users on Misskey-based servers, without registering them on this server)"
    remoteNoteEdit: "Receives and applies edits to posts made on other servers (ActivityPub Update, with an “edited” indicator)"
    contactForm: "A contact form that can be submitted without logging in (category and reply method selection, status management and assignee handling for moderators)"
    emailI18n: "Per-user language setting for system emails"
    emojiRequest: "Custom emoji requests from regular users"
    latex: "LaTeX (math formula) rendering"
    loginFailedNotification: "Notify the account owner of failed sign-in attempts (in-app notification and email)"
    mediaTimeline: "A media timeline that collects notes with attached files in a grid/carousel view (PixelFed-style UI, lightbox expansion, a per-note opt-out flag)"
    midiPlayer: "A lightweight player for MIDI files attached to notes (FluidSynth-based soundfont playback, piano roll visualizer)"
    novel: "Novel flag and novel viewer (vertical writing with paperback-style page turning and two-page spreads, ruby and Aozora Bunko notation, long works via .txt files)"
    drawRoom: "Drawing chat (pressure-sensitive drawing, multiple layers per person, member limit and visibility settings, spectating, chat, saving the finished image to Drive or posting it as a note)"
    novelEditor: "Novel editor (vertical and horizontal preview, input helpers for ruby, emphasis dots and page breaks, character count, pre-posting checks, automatic draft saving)"
    mfmSearchEngine: "Choose the search engine used by the MFM search box per user (Google, Yahoo!, Yahoo! JAPAN, Bing, DuckDuckGo, Kagi, Brave Search, Startpage, Ecosia, Perplexity, or a custom URL)"
    moderationNotifications: "New emoji/avatar decoration requests, approval-required signups, contact form submissions, and reports also appear in the regular notification list"
    nickname: "Set a private nickname for other users (shown on their profile page and hover preview)"
    oauthLogin: "OAuth sign-in with Discord/Google/GitHub/GitLab/Microsoft accounts (requires two-factor authentication to be enabled to use as a sign-in method)"
    postLanguage: "Language tagging for notes, with language-based filtering in timelines, note search, and reaction search"
    ranking: "User ranking by number of notes and reactions"
    reactionPiggyback: "Click an existing reaction on a note to add the same reaction yourself (also works with custom emoji reactions from remote servers)"
    relayTimeline: "A dedicated timeline showing only notes received via registered relays (with a filter to select multiple relays)"
    reportCategories: "Report categories, with structured links to the reported note or chat message (moderator preview)"
    requestReplacement: "\"Replacement requests\" for emoji/avatar decoration requests (replace only the image of an existing one)"
    roleApprovalDelegation: "Approval/rejection permission for emoji requests, avatar decoration requests, and approval-required signups can be granted per role, not only to moderators"
    widgetsSide: "Switch the display side (left/right) of the widgets panel/drawer"
  _route:
    additional: "Additional implementation beyond the roadmap"
    additionalDesc: "Added to address issues found while implementing the roadmap, and features inspired by other forks such as CherryPick and misskey-tempura (e.g. the nickname feature, failed sign-in notification)"
