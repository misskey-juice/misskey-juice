  reactionPiggybackOnRemoteEnabled: "Allow piggybacking on remote reactions"
  reactionPiggybackOnRemoteEnabledCaption: "Lets users click a reaction made with a custom emoji from another server and add the same reaction themselves (this does not affect piggybacking on reactions with local custom emoji or Unicode emoji). Enabling this may result in displaying and using another server's emoji images without the copyright holder's permission. Enable this at the administrator's own discretion and risk."
  aiGeneratedFallbackCw: "AI-generated content CW fallback"
  aiGeneratedFallbackCwEnabled: "Treat as CW when federating to non-compatible instances"
  aiGeneratedFallbackCwEnabledCaption: "The AI-generated content flag (isAIGenerated) is a JUICE-specific federation property, so implementations that don't support it simply ignore it. Enabling this sends a fallback CW (content warning) over ActivityPub whenever the note itself or even just one attached file is flagged as AI-generated. Notes without a CW get only the fallback text; notes that already have a CW get \"fallback text | original CW\" prepended. This is purely for federation output — the local and misskey-juice-to-misskey-juice display stays badge-only as before, and the note's own CW setting is never changed."
  novelFallbackCw: "Novel post CW fallback"
  novelFallbackCwEnabled: "Treat as CW when federating to non-compatible instances"
  novelFallbackCwEnabledCaption: "The novel flag (isNovel) is a JUICE-specific federation property, so implementations that don't support it simply ignore it. Enabling this sends a fallback CW (content warning) over ActivityPub for notes flagged as a novel. Notes without a CW get only the fallback text; notes that already have a CW get \"fallback text | original CW\" prepended. This is purely for federation output — the local and misskey-juice-to-misskey-juice display stays badge-only as before, and the note's own CW setting is never changed. If the AI-generated content CW fallback also applies to the same note, that one takes priority and the two are not combined."
  oauthLogin: "OAuth login"
  oauthLoginCaption: "Enables login using Discord, Google, GitHub, GitLab, or Microsoft accounts (OAuth login). Create an OAuth app on each service's developer site and enter the issued client ID and client secret below. Enabling this alone does not let users sign in — each user must also enable two-factor authentication on their own security settings page and individually turn on using it as a sign-in method."
  oauthLoginRedirectUriInfo: "Register both of the following as redirect URIs (callback URLs) in each service's OAuth app settings. These are the same regardless of provider."
  oauthLoginProviderEnabled: "Enable {provider} login"
  oauthClientId: "Client ID"
  oauthClientSecret: "Client secret"
  oauthScopeInfoDiscord: "Create an application in the Discord Developer Portal (discord.com/developers/applications) and register the redirect URIs above under OAuth2 settings. The identify scope alone is enough."
  oauthScopeInfoGoogle: "Create an OAuth client ID (type: Web application) in the Google Cloud Console (console.cloud.google.com) and register the redirect URIs above as authorized redirect URIs. The OAuth consent screen needs the openid, email, and profile scopes."
  oauthScopeInfoGithub: "Create an OAuth App (not a GitHub App) under GitHub's Settings → Developer settings → OAuth Apps, and register the redirect URIs above as the authorization callback URL. No additional scope configuration is needed."
  oauthScopeInfoGitlab: "Create an application under GitLab's User Settings → Applications (or Admin Area → Applications for instance admins), register the redirect URIs above, and check the read_user scope."
  oauthScopeInfoMicrosoft: "Register an app in the Microsoft Entra admin center (formerly Azure AD), add a Web platform, and register the redirect URIs above. The API permissions need Microsoft Graph's User.Read (delegated); some tenants may require admin consent."
